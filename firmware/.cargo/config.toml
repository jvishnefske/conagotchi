# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
include = ["esp-config.toml"]

[target.xtensa-esp32s3-none-elf]
# `partitions.csv` is the stock layout with otadata replaced by `conag`; it is
# resolved against the working directory, so run `cargo run` from `firmware/`.
runner = "probe-rs run --chip=esp32s3 --preverify --always-print-stacktrace --no-location --idf-partition-table partitions.csv --idf-target-app-partition factory"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Wl,--no-warn-rwx-segments",
]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
