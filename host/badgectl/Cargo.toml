[package]
name = "badgectl"
description = "Host CLI that talks to the Conagotchi discovery firmware over probe-rs RTT, and simulates badges"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
# Builds crates/badge-sim for wasm32 and embeds the module (see build.rs).
build = "build.rs"

[dependencies]
badge-proto.workspace = true
badge-core.workspace = true
heapless.workspace = true
probe-rs = "0.32.0"
probe-rs-espressif = "0.32.0"
# Same version probe-rs-espressif already pulls in; "serialport" adds the
# ROM/stub serial protocol used by `adopt` to back up and write flash.
espflash = { version = "4.6.0", default-features = false, features = ["serialport"] }
serialport = { version = "4.7", default-features = false }
tempfile = "3.27"
defmt-decoder = "1.2.0"
clap = { version = "4.6", features = ["derive", "env"] }
object = { version = "0.37", default-features = false, features = ["read", "std"] }
rustc-demangle = "0.1.27"
anyhow = "1.0.100"
thiserror = "2.0.18"
serde_json = "1.0.145"
ctrlc = "3.4"
# `badgectl sim`: the badge core as wasm32 (embedded by build.rs), the app
# runtime and ABI shared with the firmware, and the middleware bus.
badge-sim = { path = "../../crates/badge-sim" }
badge-mw.workspace = true
wasm-abi.workspace = true
wasm-runtime.workspace = true
# Same engine and version as wasm-runtime (one wasmi in the workspace); `std`
# for the host, no `wat` / `memory64` / `simd`.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate"] }
middleware = { workspace = true, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }

[features]
# `badgectl sim --zenoh <endpoint>`: simulated badges in different processes
# or machines meet over Zenoh (middleware `zenoh` backend).
zenoh = ["middleware/zenoh", "dep:tokio"]
