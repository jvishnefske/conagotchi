# Host-side workspace: the shared no_std crates (tested on the host) and the
# `badgectl` probe-rs CLI. The firmware is a separate package in `firmware/`
# because it needs the Xtensa toolchain and build-std.
[workspace]
resolver = "3"
members = [
    "crates/badge-proto",
    "crates/badge-core",
    "crates/badge-mw",
    "crates/badge-sim",
    "host/badgectl",
]
exclude = ["firmware"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
badge-proto = { path = "crates/badge-proto" }
badge-core = { path = "crates/badge-core" }
micropb = { version = "0.6.0", default-features = false, features = ["encode", "decode", "enable-64bit", "container-heapless-0-9"] }
heapless = "0.9.3"
badge-mw = { path = "crates/badge-mw" }
# Transport-agnostic pub/sub + request/response; this repo validates it.
middleware = { git = "https://github.com/jvishnefske/middleware", rev = "afd425a78d7bbe427ea09f28b8f1d47736efb0ab", default-features = false }
# The badge runs middleware's wasm platform ("mw" ABI) on its wasmi host.
wasm-host = { git = "https://github.com/jvishnefske/middleware", rev = "afd425a78d7bbe427ea09f28b8f1d47736efb0ab" }

# `badgectl sim` interprets the badge core with wasmi; unoptimised, the
# interpreter is ~100x slower and the simulator tests take minutes.
[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmi_collections]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
