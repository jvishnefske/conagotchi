# Target and output directory for the demo payload. The linker flags (1-byte
# pages, fixed 16 KiB memory, 4 KiB stack) and the path remapping that makes
# the build reproducible are set by scripts/build-apps.sh, the one supported
# way to build it.
[build]
target = "wasm32-unknown-unknown"
# Under the (git-ignored) host workspace target directory.
target-dir = "../../target/apps"
